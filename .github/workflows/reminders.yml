name: Send Appointment Reminders

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM_EMAIL: ${{ secrets.REMINDER_FROM_EMAIL }}
          REMINDER_REPLY_TO: ${{ secrets.REMINDER_REPLY_TO }}
          REMINDER_OWNER_EMAIL: ${{ secrets.REMINDER_OWNER_EMAIL }}
          REMINDER_LOOKAHEAD_HOURS: ${{ vars.REMINDER_LOOKAHEAD_HOURS }}
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}
        run: node scripts/send-reminders.mjs
